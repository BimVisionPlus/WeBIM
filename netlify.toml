# webim.vn — landing page.
#
# Trước đây tên miền này phục vụ chính bản demo tĩnh của app. Từ khi có máy
# chủ, app sống ở app.webim.vn với đầy đủ relay, kho file và AI, nên một bản
# demo thứ hai ở apex chỉ tạo ra hai thứ khác nhau mang cùng một cái tên —
# và bản ở apex là bản kém hơn. Apex giờ là trang giới thiệu, app chỉ có một
# chỗ.
#
# Vẫn ở Netlify chứ không dồn về máy chủ: đây là trang tĩnh không phụ thuộc
# gì vào server, nên để nó trên CDN có nghĩa là trang giới thiệu vẫn sống khi
# ta đang nghịch máy chủ. Netlify cũng là host duy nhất phục vụ được apex
# bằng bản ghi A thường, nên toàn bộ DNS ở lại PA Việt Nam.

[build]
  publish = "landing"
  # Trang tĩnh một file, không có bước dựng nào.
  command = ""

# Bookmark cũ trỏ vào đường dẫn của app; đưa chúng sang app.webim.vn thay vì
# trả 404 cho người đã từng dùng.
[[redirects]]
  from = "/app/*"
  to = "https://app.webim.vn/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/atlas/*"
  to = "https://atlas.webim.vn/:splat"
  status = 301
  force = true
