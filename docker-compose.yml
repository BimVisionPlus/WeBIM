version: "3.9"

# Atlas AEC — local stack.
#
# Default profile: postgres + minio + redis (always-on).
# AI profile:      ollama + whisper + bootstrap (opt-in: `docker compose --profile ai up -d`).
#
# AI stack is OSS-only (Ollama for LLM/VLM/embeddings, faster-whisper for STT) —
# no closed-API calls. Apps degrade gracefully when AI services are down.

services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-aec-postgres
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas_aec
    ports:
      - "5436:5432"
    volumes:
      - atlas-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas_aec"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: atlas-aec-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atlas
      MINIO_ROOT_PASSWORD: atlas-secret-key
    ports:
      - "9020:9000"
      - "9021:9001"
    volumes:
      - atlas-minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5

  # Auto-create buckets on first boot
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 atlas atlas-secret-key;
      mc mb -p local/models;
      mc mb -p local/drawings;
      mc mb -p local/markups;
      mc mb -p local/attachments;
      mc mb -p local/voice;
      mc anonymous set download local/markups;
      exit 0;
      "

  redis:
    image: redis:7-alpine
    container_name: atlas-aec-redis
    ports:
      - "6380:6379"

  # ─── AI stack (OSS-only) ───────────────────────────────────────────────────
  # Enable with: docker compose --profile ai up -d
  # GPU passthrough is auto-detected by Ollama when nvidia-container-toolkit
  # is installed on the host. On Apple Silicon / CPU-only hosts it falls back
  # to Metal / CPU — slow but functional.

  ollama:
    image: ollama/ollama:latest
    container_name: atlas-aec-ollama
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - atlas-ollama:/root/.ollama
    # Uncomment if you have nvidia-container-toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Pull the models we need on first boot, then exit.
  # Override default models via env on `docker compose up`.
  ollama-init:
    image: ollama/ollama:latest
    profiles: ["ai"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-qwen2.5:7b-instruct}
      OLLAMA_VLM_MODEL: ${OLLAMA_VLM_MODEL:-qwen2.5vl:7b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3}
    entrypoint: >
      /bin/sh -c "
      set -e;
      echo '[ollama-init] pulling LLM '$$OLLAMA_LLM_MODEL;
      ollama pull $$OLLAMA_LLM_MODEL || true;
      echo '[ollama-init] pulling VLM '$$OLLAMA_VLM_MODEL;
      ollama pull $$OLLAMA_VLM_MODEL || true;
      echo '[ollama-init] pulling embed '$$OLLAMA_EMBED_MODEL;
      ollama pull $$OLLAMA_EMBED_MODEL || true;
      echo '[ollama-init] done';
      "
    restart: "no"

  # Whisper STT server (OpenAI-API-compatible). CPU build by default;
  # swap image tag for CUDA variant on GPU hosts.
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: atlas-aec-whisper
    profiles: ["ai"]
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-medium}
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
      ENABLE_UI: "false"
    ports:
      - "8009:8000"
    volumes:
      - atlas-whisper:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  atlas-pg:
  atlas-minio:
  atlas-ollama:
  atlas-whisper:
