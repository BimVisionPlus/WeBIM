[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webim"
version = "0.1.0"
description = "Independent OpenBIM authoring add-on for Blender, powered by IfcOpenShell"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ifcopenshell>=0.8,<0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["webim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
