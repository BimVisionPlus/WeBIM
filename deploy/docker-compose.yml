# WeBIM production stack: Caddy (HTTPS + static + /api proxy) + platform
# server. Configure deploy/.env from .env.example first.
services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "80:80"
      - "443:443"
    environment:
      - WEBIM_DOMAIN=${WEBIM_DOMAIN}
      - ATLAS_DOMAIN=${ATLAS_DOMAIN:-atlas.webim.vn}
    networks:
      - default
      - webim_edge
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - relay

  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    # AI tự host chạy trên chính máy chủ (Ollama/vLLM), ngoài Docker. Địa chỉ
    # gateway của mạng compose đổi mỗi lần mạng được tạo lại, nên trỏ tay vào
    # nó là một cấu hình sẽ hỏng lặng lẽ vào một ngày nào đó. host-gateway để
    # Docker tự điền, và AI_BASE_URL viết cố định host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - WEBIM_SECRET=${WEBIM_SECRET}
      # Self-hosted AI only. AI_BASE_URL points at your own OpenAI-compatible
      # model server (Ollama/vLLM/llama.cpp); SD_BASE_URL at your own
      # AUTOMATIC1111-compatible Stable Diffusion. Unset = AI routes 501.
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MODEL=${AI_MODEL:-qwen2.5vl:7b}
      - AI_API_KEY=${AI_API_KEY:-}
      - SD_BASE_URL=${SD_BASE_URL:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-ap-southeast-1}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-}
    volumes:
      # users.json (auth) and local file storage when S3 is not set.
      - relay_users:/app/relay/users
      - relay_data:/app/relay/data
      - ./users.json:/app/relay/users.json:ro

volumes:
  caddy_data:
  caddy_config:
  relay_users:
  relay_data:

networks:
  # Shared with the Atlas compose project so this Caddy can proxy to it.
  # Created by bootstrap.sh: docker network create webim_edge
  webim_edge:
    external: true
