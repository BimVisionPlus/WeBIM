# AI overlay — Ollama (CPU mode) for aecplatform.vn on CPX41 (16GB).
# Runs alongside the main stack:
#   docker compose -f docker-compose.prod.yml -f docker-compose.ai.yml --env-file .env.production up -d
#
# Models (CPU, light): bge-m3 (embeddings) + qwen2.5:3b-instruct (LLM).
# Vision (qwen2.5-vl) + whisper skipped on CPU — add when GPU available.
#
# RAM budget on 16GB: stack ~1.2GB + ollama+qwen3b ~4GB + bge-m3 ~1.5GB ≈ 7GB. OK.

services:
  ollama:
    image: ollama/ollama:0.5.7
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: "10m"        # unload model after 10m idle to free RAM
      OLLAMA_NUM_PARALLEL: "1"        # CPU — one request at a time
      OLLAMA_MAX_LOADED_MODELS: "2"   # bge-m3 + qwen3b
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # One-shot: pull the two CPU models on first boot.
  ollama-init:
    image: ollama/ollama:0.5.7
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: >
      sh -c "
        ollama pull bge-m3 &&
        ollama pull qwen2.5:3b-instruct &&
        echo 'AI models ready: bge-m3 + qwen2.5:3b-instruct'
      "
    restart: "no"

  # web depends on ollama being up so the AI health check passes
  web:
    depends_on:
      minio:
        condition: service_healthy
      ollama:
        condition: service_healthy

volumes:
  ollama_models:
